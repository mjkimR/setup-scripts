[project]
name = "agentkit"
version = "0.1.0"
description = "Shared machinery for this repository's AI agent skills"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["click>=8.1"]

[project.scripts]
agentkit = "agentkit.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentkit"]

# Tests live in the repository's root tests/ tree; their pytest config lives
# with them, at tests/tools/agentkit/pytest.ini.
